<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yarn thread · AI քեզ բան</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-yarn-bg>

  <main class="stage">
    <!-- One SVG: the thread (a single path, its `d` is built in script.js) + the yarn ball riding its head.
         script.js moves the viewBox like a camera following the ball. -->
    <svg class="yarn" viewBox="10 120 2020 410" role="img" aria-labelledby="yarn-title">
      <title id="yarn-title">AI քեզ բան</title>

      <path class="yarn__thread" id="thread" />

      <!-- Ball: outer <g> is moved along the thread, inner <g> spins -->
      <g class="yarn__ball" id="ball">
        <g id="ball-spin">
          <circle r="18" />
          <path d="M -16 -8 C -6 -15, 7 -15, 16 -7" />
          <path d="M -18 1 C -7 -7, 8 -7, 18 2" />
          <path d="M -14 11 C -5 4, 6 4, 14 12" />
          <path d="M -4 -18 C -11 -6, -11 7, -2 18" />
        </g>
      </g>
    </svg>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
