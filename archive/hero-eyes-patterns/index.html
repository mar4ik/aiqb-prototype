<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern backdrops · AI քեզ բան</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-bg="orange">

  <!-- The backdrop: a strip of «rooms», one per story beat, each filled with a CSS pattern (see styles.css).
       script.js lays the rooms out in the drawing's coordinates and slides the strip with the camera,
       so the pattern moves with the world and the next room fades in as the eyes walk into it. -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__world" id="world"></div>
  </div>

  <main class="stage">
    <!-- One SVG: the line (a single path, its `d` is built in script.js) + the eyes riding its tip.
         script.js moves the viewBox like a camera following the eyes. -->
    <svg class="yarn" viewBox="10 120 2020 410" role="img" aria-labelledby="yarn-title">
      <title id="yarn-title">AI քեզ բան</title>

      <path class="yarn__thread" id="thread" />

      <!-- Eyes: outer <g> follows the tip of the line, inner <g> blinks, pupils look around -->
      <g class="eyes" id="eyes">
        <g id="eyes-blink">
          <circle class="eyes__white" cx="-13" cy="0" r="14" />
          <circle class="eyes__white" cx="13" cy="0" r="14" />
          <circle class="eyes__pupil" id="pupil-l" cx="-13" cy="0" r="6.5" />
          <circle class="eyes__pupil" id="pupil-r" cx="13" cy="0" r="6.5" />
        </g>
      </g>
    </svg>
  </main>

  <!-- Try-out bar (this experiment only): pick a pattern and a backdrop colour. The choice is kept in the URL
       (?p=grid&c=mint), so a link opens the same combination. -->
  <nav class="tryout" aria-label="Backdrop">
    <div class="tryout__group" role="group" aria-label="Pattern">
      <button type="button" data-p="mix" title="Each scene gets its own pattern">Mix</button>
      <button type="button" data-p="lines">Lines</button>
      <button type="button" data-p="grid">Grid</button>
      <button type="button" data-p="dots">Dots</button>
      <button type="button" data-p="checker">Checker</button>
      <button type="button" data-p="stripes">Stripes</button>
    </div>
    <div class="tryout__group" role="group" aria-label="Colour">
      <button type="button" class="tryout__swatch" data-c="orange" aria-label="Orange"></button>
      <button type="button" class="tryout__swatch" data-c="yellow" aria-label="Yellow"></button>
      <button type="button" class="tryout__swatch" data-c="mint" aria-label="Mint"></button>
      <button type="button" class="tryout__swatch" data-c="cyan" aria-label="Cyan"></button>
      <button type="button" class="tryout__swatch" data-c="paper" aria-label="Paper"></button>
    </div>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
