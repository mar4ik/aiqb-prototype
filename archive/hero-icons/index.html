<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Qez Ban — Bold Icons</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #050505;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
}

.hero {
  width: min(1200px, 100vw);
  aspect-ratio: 16 / 9;
  background: #050505;
  overflow: hidden;
}

svg {
  width: 100%;
  height: 100%;
  display: block;
}

.scene,
.eye,
.pupil,
#cameraFlash,
#laptopCards,
#socialCards,
#learningCards,
#automation rect,
#finalWordmark {
  transform-box: fill-box;
  transform-origin: center;
}

.line {
  fill: none;
  stroke: #fff;
  stroke-width: 9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.thin-line {
  fill: none;
  stroke: #fff;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.wordmark {
  fill: transparent;
  stroke: #fff;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  font-family: "Adelle Sans ARM", "Noto Sans Armenian", Arial, sans-serif;
  font-size: 86px;
  font-weight: 800;
  letter-spacing: 0;
  paint-order: stroke;
}

@media (prefers-reduced-motion: reduce) {
  .scene,
  .eye,
  .pupil,
  #storyLine,
  #chartLine,
  #cameraFlash,
  #laptopCards,
  #socialCards,
  #learningCards,
  #automation rect,
  #finalWordmark,
  #finalWordmarkText,
  #finalUnderline {
    transition: none;
  }
}
</style>
</head>

<script>

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const tl = gsap.timeline({
  repeat: reduceMotion ? 0 : -1,
  repeatDelay: 0,
  paused: reduceMotion
});

const scenes = [
  "#laptop",
  "#camera",
  "#megaphone",
  "#analytics",
  "#automation",
  "#book"
];


/* =========================================================
   INITIAL STATES
   ========================================================= */

gsap.set(scenes, {
  autoAlpha: 0,
  scale: 0.4
});

gsap.set("#eyes", {
  x: 0,
  y: 0,
  scale: 1
});

gsap.set("#pupilLeft, #pupilRight", {
  x: 0,
  y: 0
});

gsap.set("#storyLine", {
  strokeDasharray: 1700,
  strokeDashoffset: 1700
});

gsap.set("#laptopCards", {
  y: 40,
  autoAlpha: 0
});

gsap.set("#cameraFlash", {
  scale: 0.2,
  autoAlpha: 0
});

gsap.set("#socialCards", {
  x: -30,
  autoAlpha: 0
});

gsap.set("#chartLine", {
  strokeDasharray: 800,
  strokeDashoffset: 800
});

gsap.set("#learningCards", {
  y: 30,
  autoAlpha: 0
});

gsap.set("#finalWordmark", {
  autoAlpha: 0,
  scale: 0.92,
  y: 8
});

gsap.set("#finalWordmarkText", {
  strokeDasharray: 1800,
  strokeDashoffset: 1800
});

gsap.set("#finalUnderline", {
  strokeDasharray: 430,
  strokeDashoffset: 430
});

if (reduceMotion) {
  gsap.set("#storyLine, #chartLine", {
    strokeDashoffset: 0
  });

  gsap.set("#finalWordmark", {
    autoAlpha: 1,
    scale: 1,
    y: 0
  });

  gsap.set("#finalWordmarkText, #finalUnderline", {
    strokeDashoffset: 0
  });
}


/* =========================================================
   HELPER: BLINK
   ========================================================= */

function addBlink(position) {

  tl.to("#eyeLeft, #eyeRight", {
    scaleY: 0.06,
    duration: 0.07,
    ease: "power2.in"
  }, position);

  tl.to("#eyeLeft, #eyeRight", {
    scaleY: 1,
    duration: 0.11,
    ease: "back.out(2)"
  });
}


/* =========================================================
   01 — EYES WAKE UP
   ========================================================= */

addBlink();

tl.to("#pupilLeft, #pupilRight", {
  x: -11,
  y: 2,
  duration: 0.28,
  ease: "power2.inOut"
});

tl.to("#pupilLeft, #pupilRight", {
  x: 11,
  y: -5,
  duration: 0.32,
  ease: "power2.inOut"
});

tl.to("#pupilLeft, #pupilRight", {
  x: 3,
  y: 9,
  duration: 0.22,
  ease: "power2.inOut"
});

addBlink();

tl.to("#pupilLeft, #pupilRight", {
  x: 0,
  y: 0,
  duration: 0.2
});


/* =========================================================
   02 — LINE ENTERS
   ========================================================= */

tl.to("#storyLine", {
  strokeDashoffset: 0,
  duration: 1.1,
  ease: "power2.inOut"
});


/* =========================================================
   03 — LAPTOP
   Eyes look DOWN at the laptop
   ========================================================= */

tl.to("#eyes", {
  y: -105,
  scale: 0.72,
  duration: 0.55,
  ease: "back.out(1.8)"
});

tl.to("#laptop", {
  autoAlpha: 1,
  scale: 1,
  duration: 0.65,
  ease: "back.out(1.6)"
}, "<");

tl.to("#pupilLeft, #pupilRight", {
  x: 0,
  y: 10,
  duration: 0.25,
  ease: "power2.inOut"
}, "<");

tl.to("#laptopCards", {
  y: 0,
  autoAlpha: 1,
  duration: 0.4
});

tl.to("#pupilLeft, #pupilRight", {
  x: -7,
  y: 8,
  duration: 0.2
});

tl.to("#pupilLeft, #pupilRight", {
  x: 7,
  y: 8,
  duration: 0.22
});

tl.to("#laptop", {
  y: -6,
  duration: 0.2,
  yoyo: true,
  repeat: 1
});

addBlink();


/* =========================================================
   04 — CAMERA
   Eyes notice the camera flash
   ========================================================= */

tl.to("#laptop", {
  scaleX: 0.6,
  scaleY: 1.15,
  rotation: -8,
  autoAlpha: 0,
  duration: 0.4
});

tl.to("#camera", {
  autoAlpha: 1,
  scale: 1,
  rotation: 0,
  duration: 0.5,
  ease: "back.out(1.7)"
}, "-=0.18");

tl.to("#pupilLeft, #pupilRight", {
  x: 10,
  y: 1,
  duration: 0.25
}, "<");

tl.to("#cameraFlash", {
  autoAlpha: 1,
  scale: 1,
  duration: 0.12
});

tl.to("#eyeLeft, #eyeRight", {
  scaleY: 0.25,
  duration: 0.06
}, "<");

tl.to("#cameraFlash", {
  autoAlpha: 0,
  scale: 1.35,
  duration: 0.2
});

tl.to("#eyeLeft, #eyeRight", {
  scaleY: 1,
  duration: 0.12,
  ease: "back.out(2)"
}, "<");


/* =========================================================
   05 — MEGAPHONE
   Eyes follow things shooting out
   ========================================================= */

tl.to("#camera", {
  scaleX: 1.35,
  scaleY: 0.55,
  rotation: 7,
  autoAlpha: 0,
  duration: 0.45
});

tl.to("#megaphone", {
  scale: 1,
  autoAlpha: 1,
  rotation: 0,
  duration: 0.5,
  ease: "back.out(1.6)"
}, "-=0.22");

tl.to("#pupilLeft, #pupilRight", {
  x: 12,
  y: -2,
  duration: 0.25
}, "<");

tl.to("#socialCards", {
  x: 0,
  autoAlpha: 1,
  duration: 0.4
});

tl.to("#pupilLeft, #pupilRight", {
  x: 14,
  y: 5,
  duration: 0.22
}, "<");

tl.to("#megaphone", {
  rotation: -4,
  duration: 0.1,
  yoyo: true,
  repeat: 3
});

/* funny double blink */

addBlink();

tl.to({}, {
  duration: 0.08
});

addBlink();


/* =========================================================
   06 — ANALYTICS
   Eyes climb the graph
   ========================================================= */

tl.to("#megaphone", {
  x: -60,
  scale: 0.4,
  autoAlpha: 0,
  duration: 0.4
});

tl.to("#analytics", {
  autoAlpha: 1,
  scale: 1,
  duration: 0.55,
  ease: "back.out(1.7)"
}, "-=0.2");

tl.to("#pupilLeft, #pupilRight", {
  x: -8,
  y: 7,
  duration: 0.22
}, "<");

tl.to("#chartLine", {
  strokeDashoffset: 0,
  duration: 0.6,
  ease: "power2.inOut"
});

tl.to("#pupilLeft, #pupilRight", {
  x: 0,
  y: 0,
  duration: 0.2
});

tl.to("#pupilLeft, #pupilRight", {
  x: 8,
  y: -10,
  duration: 0.32,
  ease: "power2.inOut"
});

addBlink();


/* =========================================================
   07 — AUTOMATION
   Eyes scan between nodes
   ========================================================= */

tl.to("#analytics", {
  scale: 0.5,
  rotation: 10,
  autoAlpha: 0,
  duration: 0.4
});

tl.to("#automation", {
  scale: 1,
  autoAlpha: 1,
  duration: 0.55,
  ease: "back.out(1.8)"
}, "-=0.2");

tl.to("#pupilLeft, #pupilRight", {
  x: -10,
  y: 2,
  duration: 0.2
}, "<");

tl.to("#automationCore", {
  rotation: 360,
  duration: 0.8,
  ease: "power2.inOut"
});

tl.to("#pupilLeft, #pupilRight", {
  x: 10,
  y: 3,
  duration: 0.22
}, "-=0.55");

tl.to("#pupilLeft, #pupilRight", {
  x: -5,
  y: 8,
  duration: 0.2
});

tl.to("#automation rect", {
  scale: 1.12,
  duration: 0.18,
  yoyo: true,
  repeat: 1,
  stagger: 0.08
});

addBlink();


/* =========================================================
   08 — BOOK
   Eyes read
   ========================================================= */

tl.to("#automation", {
  scaleX: 1.3,
  scaleY: 0.45,
  autoAlpha: 0,
  duration: 0.45
});

tl.to("#book", {
  scale: 1,
  autoAlpha: 1,
  duration: 0.55,
  ease: "back.out(1.6)"
}, "-=0.2");

tl.to("#pupilLeft, #pupilRight", {
  x: -7,
  y: 10,
  duration: 0.25
}, "<");

tl.to("#learningCards", {
  y: 0,
  autoAlpha: 1,
  duration: 0.4
});

tl.to("#pupilLeft, #pupilRight", {
  x: 7,
  y: 10,
  duration: 0.28
});

tl.to("#pupilLeft, #pupilRight", {
  x: -5,
  y: 10,
  duration: 0.25
});

tl.to("#book", {
  scaleY: 1.08,
  duration: 0.18,
  yoyo: true,
  repeat: 1
});


/* =========================================================
   09 — RETURN TO EYES
   ========================================================= */

tl.to("#book", {
  scale: 0.08,
  rotation: 10,
  autoAlpha: 0,
  duration: 0.6,
  ease: "power3.in"
});

tl.to("#eyes", {
  y: 0,
  scale: 1,
  duration: 0.6,
  ease: "back.out(1.8)"
}, "-=0.2");

tl.to("#pupilLeft, #pupilRight", {
  x: 0,
  y: 0,
  duration: 0.2
}, "<");

tl.to("#storyLine", {
  strokeDashoffset: -1700,
  duration: 0.8,
  ease: "power2.inOut"
});


/* =========================================================
   10 — FINAL PERSONALITY BEAT
   ========================================================= */

tl.to("#pupilLeft, #pupilRight", {
  x: -9,
  y: 0,
  duration: 0.22
});

tl.to("#pupilLeft, #pupilRight", {
  x: 9,
  y: 0,
  duration: 0.22
});

addBlink();

tl.to("#pupilLeft, #pupilRight", {
  x: 0,
  y: 0,
  duration: 0.2
});

tl.to("#eyes", {
  y: -58,
  scale: 0.62,
  duration: 0.45,
  ease: "power2.inOut"
});

tl.to("#finalWordmark", {
  autoAlpha: 1,
  scale: 1,
  y: 0,
  duration: 0.25,
  ease: "power2.out"
}, "-=0.12");

tl.to("#finalWordmarkText", {
  strokeDashoffset: 0,
  duration: 0.9,
  ease: "power2.inOut"
});

tl.to("#finalUnderline", {
  strokeDashoffset: 0,
  duration: 0.34,
  ease: "power2.out"
}, "-=0.18");

tl.to({}, {
  duration: 0.45
});

tl.to("#finalWordmark", {
  autoAlpha: 0,
  y: -8,
  scale: 1.02,
  duration: 0.35,
  ease: "power2.in"
});

tl.to("#eyes", {
  y: 0,
  scale: 1,
  duration: 0.45,
  ease: "power2.inOut"
}, "-=0.25");


/* =========================================================
   RESET
   ========================================================= */

tl.set("#laptop", {
  x: 0,
  y: 0,
  rotation: 0,
  scale: 0.4,
  scaleX: 1,
  scaleY: 1,
  autoAlpha: 0
});

tl.set("#camera", {
  x: 0,
  y: 0,
  rotation: 0,
  scale: 0.4,
  scaleX: 1,
  scaleY: 1,
  autoAlpha: 0
});

tl.set("#megaphone", {
  x: 0,
