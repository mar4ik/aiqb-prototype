<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI քեզ Բժիշկ — Նախնական գրանցում</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="signup">
    <a href="index.html" class="signup__logo"><img src="assets/logos/AIQB_logo.svg" alt="AI Քեզ Բան" /></a>

    <form class="promo-form" novalidate>
      <h1 class="promo-form__title">AI քեզ Բժիշկ — Նախնական գրանցում</h1>
      <div class="promo-form__fields">
        <label class="field">
          <span class="field__label">Անուն</span>
          <input class="field__input" type="text" name="firstName" autocomplete="given-name" required />
        </label>
        <label class="field">
          <span class="field__label">Ազգանուն</span>
          <input class="field__input" type="text" name="lastName" autocomplete="family-name" required />
        </label>
        <label class="field">
          <span class="field__label">Էլ. հասցե</span>
          <input class="field__input" type="email" name="email" placeholder="example@email.com" autocomplete="email" required />
        </label>
      </div>
      <button type="submit" class="btn btn--primary btn--block btn--md" disabled>Գրանցվել</button>

      <div class="signup__done" role="status">
        <p class="promo-form__title">Շնորհակալություն, գրանցումն ընդունված է։</p>
        <p>Մենք ձեզ հետ կապ կհաստատենք, երբ դասընթացը պատրաստ լինի։</p>
      </div>
    </form>

    <a href="index.html" class="signup__back">Վերադառնալ գլխավոր էջ</a>
  </main>

  <script>
    // All three fields are required; the button unlocks once they're valid.
    // TODO: no backend yet — send the data to the real sign-up endpoint here.
    (function () {
      const form = document.querySelector('.promo-form');
      const submit = form.querySelector('[type="submit"]');
      const fields = Array.from(form.querySelectorAll('input'));
      const valid = () => fields.every((f) => f.value.trim() && f.checkValidity());
      form.addEventListener('input', () => { submit.disabled = !valid(); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!valid()) return;
        form.classList.add('is-done');
      });
    })();
  </script>
</body>
</html>
